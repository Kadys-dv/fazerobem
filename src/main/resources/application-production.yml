spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true}
server:
  forward-headers-strategy: framework
  servlet:
    session:
      cookie:
        secure: true
        http-only: true
        same-site: strict
app:
  crypto:
    key-id: ${APP_CRYPTO_KEY_ID}
    master-key-base64: ${APP_CRYPTO_MASTER_KEY_BASE64:}
  security:
    mfa-required-for-privileged: true
  sandbox:
    webhook-secret: ${SANDBOX_WEBHOOK_SECRET}
  webauthn:
    rp-name: ${WEBAUTHN_RP_NAME}
    rp-id: ${WEBAUTHN_RP_ID}
    allowed-origins: ${WEBAUTHN_ALLOWED_ORIGINS}
  kms:
    provider: ${KMS_PROVIDER}
    aws-key-id: ${AWS_KMS_KEY_ID:}
  production:
    public-base-url: ${PUBLIC_BASE_URL}
    tls-required: true
    trust-forwarded-https: ${TRUST_FORWARDED_HTTPS:true}
management:
  endpoint:
    health:
      show-details: never

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: ajuda_mutua
      POSTGRES_USER: ajuda
      POSTGRES_PASSWORD: ajuda_dev
    ports:
      - "5432:5432"
    volumes:
      - ajuda_mutua_pg:/var/lib/postgresql/data
  redis:
    image: redis:8-alpine
    command: ["redis-server","--appendonly","yes"]
    ports:
      - "6379:6379"
    volumes:
      - ajuda_mutua_redis:/data
volumes:
  ajuda_mutua_pg:
  ajuda_mutua_redis:

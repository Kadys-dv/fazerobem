name: pilot-simulation

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pilot-simulation:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Generate ephemeral CI secrets
        shell: bash
        run: |
          DB_PASSWORD_VALUE=$(openssl rand -hex 24)
          APP_KEY_VALUE=$(openssl rand -base64 32 | tr -d '\n')
          WEBHOOK_SECRET_VALUE=$(openssl rand -hex 32)
          echo "::add-mask::$DB_PASSWORD_VALUE"
          echo "::add-mask::$APP_KEY_VALUE"
          echo "::add-mask::$WEBHOOK_SECRET_VALUE"
          echo "CI_DB_PASSWORD=$DB_PASSWORD_VALUE" >> "$GITHUB_ENV"
          echo "APP_CRYPTO_MASTER_KEY_BASE64=$APP_KEY_VALUE" >> "$GITHUB_ENV"
          echo "SANDBOX_WEBHOOK_SECRET=$WEBHOOK_SECRET_VALUE" >> "$GITHUB_ENV"

      - name: Start PostgreSQL and Redis
        shell: bash
        run: |
          docker run -d --name fazerobem-pilot-pg \
            -e POSTGRES_DB=ajuda_mutua_pilot \
            -e POSTGRES_USER=ajuda_pilot \
            -e POSTGRES_PASSWORD="$CI_DB_PASSWORD" \
            -p 5432:5432 postgres:17-alpine
          docker run -d --name fazerobem-pilot-redis -p 6379:6379 redis:8-alpine

      - name: Wait for dependencies
        shell: bash
        run: |
          postgres_ready=false
          for i in {1..40}; do
            if pg_isready -h 127.0.0.1 -p 5432 -U ajuda_pilot -d ajuda_mutua_pilot >/dev/null 2>&1; then
              postgres_ready=true
              break
            fi
            sleep 2
          done
          if [ "$postgres_ready" != "true" ]; then
            docker logs fazerobem-pilot-pg || true
            echo "PostgreSQL did not become ready on 127.0.0.1:5432" >&2
            exit 1
          fi
          pg_isready -h 127.0.0.1 -p 5432 -U ajuda_pilot -d ajuda_mutua_pilot

          redis_ready=false
          for i in {1..40}; do
            if docker exec fazerobem-pilot-redis redis-cli ping 2>/dev/null | grep -q PONG; then
              redis_ready=true
              break
            fi
            sleep 1
          done
          if [ "$redis_ready" != "true" ]; then
            docker logs fazerobem-pilot-redis || true
            echo "Redis did not become ready inside container" >&2
            exit 1
          fi
          docker exec fazerobem-pilot-redis redis-cli ping | grep -q PONG

      - name: Start application
        shell: bash
        env:
          DB_URL: jdbc:postgresql://localhost:5432/ajuda_mutua_pilot
          DB_USER: ajuda_pilot
          REDIS_HOST: localhost
          REDIS_PORT: '6379'
          KMS_PROVIDER: local
          APP_SECURITY_MFA_REQUIRED_FOR_PRIVILEGED: 'false'
          PAYMENT_INITIATION_ENABLED: 'true'
        run: |
          export DB_PASSWORD="$CI_DB_PASSWORD"
          nohup mvn -B spring-boot:run -Dspring-boot.run.profiles=dev > /tmp/fazerobem-pilot-app.log 2>&1 &
          echo $! > /tmp/fazerobem-pilot-app.pid
          for i in {1..90}; do
            curl -fsS http://localhost:8080/api/v1/transparency >/dev/null && exit 0
            sleep 2
          done
          cat /tmp/fazerobem-pilot-app.log
          exit 1

      - name: Run pilot simulation
        working-directory: e2e
        env:
          BASE_URL: http://localhost:8080
          SANDBOX_WEBHOOK_SECRET: ${{ env.SANDBOX_WEBHOOK_SECRET }}
          PILOT_MEMBER_COUNT: '50'
          PILOT_AID_COUNT: '20'
          PILOT_PAID_SAMPLE_COUNT: '3'
          PILOT_CONCURRENCY: '10'
        run: |
          npm install
          npx playwright test tests/pilot-simulation.spec.ts --workers=1

      - name: Verify pilot financial invariants in PostgreSQL
        shell: bash
        env:
          PGPASSWORD: ${{ env.CI_DB_PASSWORD }}
        run: |
          docker exec -e PGPASSWORD="$CI_DB_PASSWORD" fazerobem-pilot-pg \
            psql -U ajuda_pilot -d ajuda_mutua_pilot -Atc \
            "select count(*) from (select aid_request_id from payment_attempts where status in ('READY','PROCESSING','SETTLED','RECONCILIATION_REQUIRED') group by aid_request_id having count(*) > 1) x;" | grep -qx '0'

          docker exec -e PGPASSWORD="$CI_DB_PASSWORD" fazerobem-pilot-pg \
            psql -U ajuda_pilot -d ajuda_mutua_pilot -Atc \
            "select count(*) from payment_attempts p join aid_requests a on a.id=p.aid_request_id where p.status='SETTLED' and a.status <> 'PAID';" | grep -qx '0'

          docker exec -e PGPASSWORD="$CI_DB_PASSWORD" fazerobem-pilot-pg \
            psql -U ajuda_pilot -d ajuda_mutua_pilot -Atc \
            "select count(*) from (select aid_request_id from ledger_entries where type='AID_PAYMENT' group by aid_request_id having count(*) > 1) x;" | grep -qx '0'

      - name: Show logs on failure
        if: failure()
        run: cat /tmp/fazerobem-pilot-app.log || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test -f /tmp/fazerobem-pilot-app.pid && kill "$(cat /tmp/fazerobem-pilot-app.pid)" || true
          docker rm -f fazerobem-pilot-pg fazerobem-pilot-redis || true

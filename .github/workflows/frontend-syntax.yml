name: frontend-syntax

on: [push, pull_request]

permissions:
  contents: read

jobs:
  javascript-syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - name: Validate static JavaScript syntax
        run: |
          node --check src/main/resources/static/app.js
          node --check src/main/resources/static/operations.js

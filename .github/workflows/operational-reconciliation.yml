name: operational-reconciliation

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  operational-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Reconciliation aging and observability tests
        run: mvn -B -Dtest=ReconciliationJobObservabilityTest,OperationalMetricsTest,PaymentServiceReconciliationTest test

name: staging-observability-dast

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  staging-observability-dast:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Validate Neon staging secrets
        shell: bash
        env:
          DB_URL: ${{ secrets.NEON_STAGING_JDBC_URL }}
          DB_USER: ${{ secrets.NEON_STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.NEON_STAGING_DB_PASSWORD }}
        run: |
          set -euo pipefail
          test -n "$DB_URL"
          test -n "$DB_USER"
          test -n "$DB_PASSWORD"
          case "$DB_URL" in
            jdbc:postgresql://*sslmode=require*) ;;
            *) echo "Neon staging JDBC URL must require TLS" >&2; exit 1 ;;
          esac

      - name: Generate ephemeral application secrets
        shell: bash
        run: |
          set -euo pipefail
          APP_KEY=$(openssl rand -base64 32 | tr -d '\n')
          WEBHOOK_SECRET=$(openssl rand -hex 32)
          echo "::add-mask::$APP_KEY"
          echo "::add-mask::$WEBHOOK_SECRET"
          echo "APP_KEY=$APP_KEY" >> "$GITHUB_ENV"
          echo "WEBHOOK_SECRET=$WEBHOOK_SECRET" >> "$GITHUB_ENV"

      - name: Start staging service
        shell: bash
        env:
          DB_URL: ${{ secrets.NEON_STAGING_JDBC_URL }}
          DB_USER: ${{ secrets.NEON_STAGING_DB_USER }}
          DB_PASSWORD: ${{ secrets.NEON_STAGING_DB_PASSWORD }}
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: '6379'
          REDIS_PASSWORD: ''
          APP_CRYPTO_KEY_ID: ci-observability-staging
          KMS_PROVIDER: local
          DOCUMENTS_PATH: /tmp/fazerobem-observability-documents
          PAYMENT_INITIATION_ENABLED: 'false'
          WEBAUTHN_RP_NAME: Fazer o Bem Staging
          WEBAUTHN_RP_ID: staging.fazerobem.invalid
          WEBAUTHN_ALLOWED_ORIGINS: https://staging.fazerobem.invalid
          TRACE_SAMPLE_PROBABILITY: '1.0'
          APP_SECURITY_MFA_REQUIRED_FOR_PRIVILEGED: 'false'
          MANAGEMENT_PORT: '18081'
        run: |
          set -euo pipefail
          export APP_CRYPTO_MASTER_KEY_BASE64="$APP_KEY"
          export SANDBOX_WEBHOOK_SECRET="$WEBHOOK_SECRET"
          mkdir -p "$DOCUMENTS_PATH" evidence
          nohup mvn -B spring-boot:run -Dspring-boot.run.profiles=staging > /tmp/staging-observability.log 2>&1 &
          echo $! > /tmp/staging-observability.pid
          ready=false
          for i in {1..90}; do
            if curl -fsS http://127.0.0.1:8080/api/v1/transparency >/dev/null; then
              ready=true
              break
            fi
            sleep 2
          done
          if [ "$ready" != true ]; then
            cat /tmp/staging-observability.log
            exit 1
          fi

      - name: Validate private observability plane
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence
          health_status=$(curl -sS -D evidence/health.headers -o evidence/health.body -w '%{http_code}' http://127.0.0.1:18081/actuator/health || true)
          prometheus_status=$(curl -sS -D evidence/prometheus.headers -o evidence/prometheus.body -w '%{http_code}' http://127.0.0.1:18081/actuator/prometheus || true)
          printf '%s\n' "$health_status" > evidence/health.status
          printf '%s\n' "$prometheus_status" > evidence/prometheus.status
          case "$health_status" in
            200)
              python3 - <<'PY'
          import json
          from pathlib import Path
          health=json.loads(Path('evidence/health.body').read_text())
          assert health == {'status':'UP'}, health
          PY
              ;;
            302) grep -Eiq '^location:.*login' evidence/health.headers || { echo "health 302 without login redirect" >&2; exit 1; } ;;
            401|403) ;;
            *) echo "unexpected actuator health status: $health_status" >&2; exit 1 ;;
          esac
          case "$prometheus_status" in
            200) grep -q 'jvm_memory_used_bytes' evidence/prometheus.body ;;
            302) grep -Eiq '^location:.*login' evidence/prometheus.headers || { echo "prometheus 302 without login redirect" >&2; exit 1; } ;;
            401|403) ;;
            *) echo "unexpected prometheus status: $prometheus_status" >&2; exit 1 ;;
          esac
          grep -q 'Exposing 3 endpoints beneath base path' /tmp/staging-observability.log
          grep -q 'include: health,prometheus,metrics' src/main/resources/application-staging.yml
          if ss -ltn | grep -Eq '0\.0\.0\.0:18081|\[::\]:18081'; then
            echo "management plane exposed on non-loopback interface" >&2
            exit 1
          fi

      - name: Probe application from an external process boundary
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm --add-host=host.docker.internal:host-gateway curlimages/curl:8.15.0 -fsS --retry 5 --retry-delay 1 http://host.docker.internal:8080/api/v1/transparency -o /dev/null
          if docker run --rm --add-host=host.docker.internal:host-gateway curlimages/curl:8.15.0 -fsS http://host.docker.internal:18081/actuator/prometheus >/dev/null 2>&1; then
            echo "management plane reachable from container boundary" >&2
            exit 1
          fi

      - name: Run OWASP ZAP baseline against staging profile
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p evidence/zap
          sudo chown -R 1000:1000 evidence/zap
          set +e
          docker run --rm --add-host=host.docker.internal:host-gateway -v "$PWD/evidence/zap:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t http://host.docker.internal:8080 -J zap-report.json -r zap-report.html -I -m 2
          zap_status=$?
          set -e
          test "$zap_status" -ne 3 || { echo "ZAP could not complete the scan" >&2; exit 1; }
          sudo chown -R "$(id -u):$(id -g)" evidence/zap
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=Path('evidence/zap/zap-report.json')
          if not p.exists(): raise SystemExit('ZAP JSON report missing')
          report=json.loads(p.read_text())
          findings=[]
          for site in report.get('site',[]):
              for alert in site.get('alerts',[]):
                  risk=int(alert.get('riskcode','0'))
                  if risk >= 2: findings.append((risk, alert.get('name')))
          if findings: raise SystemExit(f'ZAP medium/high findings: {findings}')
          PY

      - name: Record evidence summary
        if: always()
        shell: bash
        run: |
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "commit=${GITHUB_SHA}"
            echo "scope=ci_staging_profile_observability_and_passive_dast"
            echo "payment_initiation_enabled=false"
            echo "management_bind=127.0.0.1:18081"
            echo "external_internet_health=PENDING"
            echo "independent_pentest=PENDING"
          } > evidence/summary.txt

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: staging-observability-dast-${{ github.run_id }}
          path: evidence/
          if-no-files-found: error
          retention-days: 30

      - name: Show application logs on failure
        if: failure()
        run: cat /tmp/staging-observability.log || true

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          test -f /tmp/staging-observability.pid && kill "$(cat /tmp/staging-observability.pid)" || true
          rm -rf /tmp/fazerobem-observability-documents

name: production-readiness

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  production-readiness:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run production validation unit tests
        run: mvn -B -Dtest=ProductionReadinessValidatorTest test

      - name: Production must fail with incomplete configuration
        shell: bash
        run: |
          set +e
          timeout 45s mvn -B spring-boot:run -Dspring-boot.run.profiles=production > /tmp/prod-incomplete.log 2>&1
          code=$?
          set -e
          cat /tmp/prod-incomplete.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Production unexpectedly started or stayed alive with incomplete configuration"
            exit 1
          fi
          grep -Eq "Could not resolve placeholder|Production readiness validation failed" /tmp/prod-incomplete.log

      - name: Reject explicitly insecure production settings
        shell: bash
        env:
          DB_URL: jdbc:postgresql://db.invalid:5432/fazerobem
          DB_USER: fazerobem
          DB_PASSWORD: synthetic-db-secret
          REDIS_HOST: redis.invalid
          REDIS_PORT: '6379'
          REDIS_PASSWORD: synthetic-redis-secret
          APP_CRYPTO_KEY_ID: prod-key-v1
          SANDBOX_WEBHOOK_SECRET: synthetic-sandbox-secret
          PUBLIC_BASE_URL: http://localhost:8080
          WEBAUTHN_RP_NAME: Fazer o Bem
          WEBAUTHN_RP_ID: localhost
          WEBAUTHN_ALLOWED_ORIGINS: http://localhost:8080
          KMS_PROVIDER: local
        run: |
          set +e
          timeout 45s mvn -B spring-boot:run -Dspring-boot.run.profiles=production > /tmp/prod-insecure.log 2>&1
          code=$?
          set -e
          cat /tmp/prod-insecure.log
          if [ "$code" -eq 0 ] || [ "$code" -eq 124 ]; then
            echo "Production unexpectedly accepted insecure configuration"
            exit 1
          fi

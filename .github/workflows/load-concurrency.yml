name: load-concurrency

on:
  push:
  pull_request:

jobs:
  load-concurrency:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Run financial load and concurrency gate
        run: mvn -B -Dtest=LoadConcurrencyIntegrationTest test
      - name: Publish load report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: phase8-load-concurrency-report
          if-no-files-found: warn
          path: |
            target/load-concurrency-report.md
            target/surefire-reports/TEST-br.com.ajudamutua.integration.LoadConcurrencyIntegrationTest.xml

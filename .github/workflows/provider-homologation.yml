name: provider-homologation

on:
  pull_request:
  push:
    branches: [ main ]

jobs:
  provider-homologation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Provider contract, retry, webhook and reconciliation tests
        run: ./mvnw -B -Dtest=SandboxPaymentProviderContractTest,PaymentServiceTest,WebhookSignatureServiceTest,PaymentServiceReconciliationTest test
